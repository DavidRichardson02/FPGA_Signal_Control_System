<!-- save as: assets/system_block_diagram_um.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-label="FPGA Signal Control System block diagram (UM blue/maize)">
  <defs>
    <!-- UM palette -->
    <!-- Michigan Blue: #00274C | Michigan Maize: #FFCB05 -->
    <style>
      :root{
        --um-blue:#00274C;
        --um-blue-2:#0B3A66;
        --um-maize:#FFCB05;

        --bg:#ffffff;
        --card:#f7f9fb;
        --card2:#eef3f8;
        --stroke:#0b1220;
        --muted:#44566c;

        --title:#00274C;
        --text:#0b1220;
        --line:#00274C;
        --accent:#FFCB05;
        --accent2:#0B3A66;

        --shadow: rgba(0,0,0,0.10);
      }

      /* Dark mode keeps UM identity, but flips contrast */
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#0b1220;
          --card:#121b2a;
          --card2:#0f1724;
          --stroke:#e6edf3;
          --muted:#9bb0c3;

          --title:#FFCB05;
          --text:#e6edf3;
          --line:#7aa6d8;
          --accent:#FFCB05;
          --accent2:#58a6ff;

          --shadow: rgba(0,0,0,0.35);
        }
      }

      /* Typography tuned for "banner" look */
      .title { font: 800 26px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; letter-spacing: 0.2px; fill: var(--title); }
      .subtitle { font: 600 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: var(--muted); }
      .h2 { font: 800 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: var(--text); letter-spacing: 0.2px; }
      .t { font: 700 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: var(--text); }
      .m { font: 600 11px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: var(--muted); }

      .bg { fill: var(--bg); }
      .card { fill: var(--card); stroke: var(--stroke); stroke-width: 1.6; }
      .card2 { fill: var(--card2); stroke: var(--stroke); stroke-width: 1.2; }
      .box { fill: var(--bg); stroke: var(--stroke); stroke-width: 1.2; }
      .pill { fill: var(--um-blue); stroke: var(--stroke); stroke-width: 1.2; }
      @media (prefers-color-scheme: dark){
        .pill { fill: #0b3a66; }
      }

      .wire { stroke: var(--line); stroke-width: 2.0; fill: none; }
      .wireA { stroke: var(--accent2); stroke-width: 2.6; fill: none; }
      .wireM { stroke: var(--accent); stroke-width: 2.8; fill: none; }
      .dash { stroke-dasharray: 7 7; }

      .chip { fill: var(--um-maize); }
      .chipText { font: 900 10px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #1a1a1a; }
      @media (prefers-color-scheme: dark){
        .chipText { fill: #0b1220; }
      }

      .shadow { filter: drop-shadow(0 8px 18px var(--shadow)); }
    </style>

    <!-- Header gradient strip -->
    <linearGradient id="hdr" x1="0" x2="1">
      <stop offset="0" stop-color="#00274C" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFCB05" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Arrowheads -->
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="var(--line)"/>
    </marker>
    <marker id="arrA" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="var(--accent2)"/>
    </marker>
    <marker id="arrM" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1600" height="520" rx="22"/>

  <!-- Header band -->
  <g class="shadow">
    <rect x="24" y="20" width="1552" height="74" rx="16" fill="url(#hdr)" stroke="var(--stroke)" stroke-width="1.3"/>
  </g>
  <text class="title" x="54" y="62">FPGA_Signal_Control_System</text>
  <text class="subtitle" x="54" y="82">Sensors → Acquisition/CDC → Mapping/Control → VGA HUD + UART Telemetry → PC Analysis Feedback</text>

  <!-- Left column: Inputs -->
  <g class="shadow">
    <rect class="card" x="24" y="118" width="300" height="372" rx="16"/>
  </g>
  <text class="h2" x="52" y="150">Inputs</text>

  <!-- Input boxes -->
  <rect class="box" x="52" y="168" width="244" height="64" rx="12"/>
  <text class="t" x="66" y="195">ISL29501 ToF</text>
  <text class="m" x="66" y="214">I²C: range + quality</text>

  <rect class="box" x="52" y="246" width="244" height="64" rx="12"/>
  <text class="t" x="66" y="273">PIR Motion</text>
  <text class="m" x="66" y="292">occupancy / activity</text>

  <rect class="box" x="52" y="324" width="244" height="64" rx="12"/>
  <text class="t" x="66" y="351">Rotary Encoder</text>
  <text class="m" x="66" y="370">θ / manual + auto sweep</text>

  <rect class="box" x="52" y="402" width="244" height="64" rx="12"/>
  <text class="t" x="66" y="429">XADC Temperature</text>
  <text class="m" x="66" y="448">die temp / rails telemetry</text>

  <!-- Center: FPGA main -->
  <g class="shadow">
    <rect class="card" x="340" y="118" width="920" height="372" rx="16"/>
  </g>
  <text class="h2" x="368" y="150">FPGA RTL (Nexys A7 / Artix-7)</text>

  <!-- SYS domain lane -->
  <rect class="card2" x="368" y="168" width="560" height="136" rx="14"/>
  <text class="t" x="388" y="192">sys_clk = 100 MHz</text>

  <!-- PIX domain lane -->
  <rect class="card2" x="948" y="168" width="284" height="136" rx="14"/>
  <text class="t" x="968" y="192">pix_clk = 25 MHz</text>

  <!-- SYS submodules -->
  <rect class="box" x="388" y="212" width="250" height="74" rx="12"/>
  <text class="t" x="402" y="238">isl29501_if · pir_sync</text>
  <text class="m" x="402" y="257">rotary_encoder_if · xadc_temp_reader</text>

  <rect class="box" x="654" y="212" width="254" height="74" rx="12"/>
  <text class="t" x="668" y="238">sensor_cdc_bridge</text>
  <text class="m" x="668" y="257">clean strobes + stable buses</text>

  <rect class="box" x="388" y="324" width="250" height="76" rx="12"/>
  <text class="t" x="402" y="350">spatial_mapper</text>
  <text class="m" x="402" y="369">angle_accumulator · range_filter</text>

  <rect class="box" x="654" y="324" width="254" height="76" rx="12"/>
  <text class="t" x="668" y="350">Control</text>
  <text class="m" x="668" y="369">survey_mode_fsm · fan_pwm_controller</text>

  <rect class="box" x="924" y="324" width="308" height="76" rx="12"/>
  <text class="t" x="938" y="350">Telemetry</text>
  <text class="m" x="938" y="369">mapper_packetizer → uart_stream_tx</text>

  <!-- PIX submodules -->
  <rect class="box" x="968" y="212" width="244" height="74" rx="12"/>
  <text class="t" x="982" y="238">VGA HUD</text>
  <text class="m" x="982" y="257">vga_timing · vga_range_plot · vga_status_overlay</text>

  <!-- Domain chips -->
  <g>
    <rect class="chip" x="368" y="150" width="118" height="18" rx="9"/>
    <text class="chipText" x="380" y="163">SYSTEM DOMAIN</text>

    <rect class="chip" x="948" y="150" width="104" height="18" rx="9"/>
    <text class="chipText" x="960" y="163">PIXEL DOMAIN</text>
  </g>

  <!-- Right: Outputs + PC -->
  <g class="shadow">
    <rect class="card" x="1276" y="118" width="300" height="372" rx="16"/>
  </g>
  <text class="h2" x="1304" y="150">Outputs / PC</text>

  <rect class="box" x="1304" y="168" width="244" height="64" rx="12"/>
  <text class="t" x="1318" y="195">VGA Monitor</text>
  <text class="m" x="1318" y="214">real-time HUD + map</text>

  <rect class="box" x="1304" y="246" width="244" height="64" rx="12"/>
  <text class="t" x="1318" y="273">UART Capture</text>
  <text class="m" x="1318" y="292">TeraTerm / Python / MATLAB</text>

  <rect class="box" x="1304" y="324" width="244" height="64" rx="12"/>
  <text class="t" x="1318" y="351">Analysis + Reports</text>
  <text class="m" x="1318" y="370">calibration, plots, LaTeX/PDF</text>

  <rect class="pill" x="1304" y="408" width="244" height="44" rx="22"/>
  <text class="t" x="1318" y="435" fill="var(--um-maize)">Feedback: LUTs · thresholds · RTL</text>

  <!-- =========================
       Wiring (UM-styled)
       ========================= -->

  <!-- Inputs → Interfaces -->
  <path class="wireA" marker-end="url(#arrA)" d="M296 200 C320 200, 334 224, 388 248"/>
  <path class="wireA" marker-end="url(#arrA)" d="M296 278 C320 278, 334 250, 388 248"/>
  <path class="wireA" marker-end="url(#arrA)" d="M296 356 C320 356, 334 270, 388 248"/>
  <path class="wireA" marker-end="url(#arrA)" d="M296 434 C320 434, 336 286, 388 248"/>

  <!-- Interfaces → CDC -->
  <path class="wire" marker-end="url(#arr)" d="M638 248 C645 248, 650 248, 654 248"/>

  <!-- CDC → Mapper (sys) -->
  <path class="wire" marker-end="url(#arr)" d="M781 286 C781 312, 510 312, 510 324"/>

  <!-- CDC → Control -->
  <path class="wire" marker-end="url(#arr)" d="M781 286 C781 312, 781 312, 781 324"/>

  <!-- Mapper → VGA (pix) -->
  <path class="wireM" marker-end="url(#arrM)" d="M638 362 C760 362, 870 290, 968 248"/>

  <!-- Mapper + Control → Telemetry -->
  <path class="wire" marker-end="url(#arr)" d="M638 362 C700 362, 780 362, 924 362"/>
  <path class="wire" marker-end="url(#arr)" d="M908 362 C912 362, 918 362, 924 362"/>

  <!-- VGA → Monitor -->
  <path class="wireM" marker-end="url(#arrM)" d="M1212 248 C1260 248, 1276 200, 1304 200"/>

  <!-- Telemetry → UART Capture -->
  <path class="wireM" marker-end="url(#arrM)" d="M1232 362 C1262 362, 1276 278, 1304 278"/>

  <!-- PC pipeline internal -->
  <path class="wire" marker-end="url(#arr)" d="M1426 310 C1426 324, 1426 324, 1426 324"/>
  <path class="wire" marker-end="url(#arr)" d="M1426 388 C1426 402, 1426 402, 1426 408"/>

  <!-- Feedback loop (dashed) -->
  <path class="wire dash" marker-end="url(#arr)" d="M1426 452 C1050 520, 640 520, 640 400"/>

  <!-- Footer -->
  <text class="subtitle" x="54" y="506">Clock domains are explicit: sys_clk (acquisition/mapping/control/telemetry) and pix_clk (VGA). CDC bridges isolate domains.</text>
</svg>

